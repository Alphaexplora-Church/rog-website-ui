<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sunday Service" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#0f2b26"/>
      <stop offset="100%" stop-color="#123b34"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#8FD4C9" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#8FD4C9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8FD4C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b7a70" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1b7a70" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1b7a70" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD4C9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FD4C9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FD4C9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#sunGlow)"/>

  <!-- Rays of light -->
  <g opacity="0.18" stroke="#8FD4C9" stroke-width="2">
    <line x1="640" y1="0" x2="380" y2="720"/>
    <line x1="640" y1="0" x2="520" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="640" y1="0" x2="760" y2="720"/>
    <line x1="640" y1="0" x2="900" y2="720"/>
  </g>

  <!-- Cross -->
  <g stroke="#e9f6f2" stroke-width="14" stroke-linecap="round" opacity="0.92">
    <line x1="640" y1="150" x2="640" y2="430"/>
    <line x1="546" y1="230" x2="734" y2="230"/>
  </g>
  <circle cx="640" cy="290" r="150" fill="none" stroke="#8FD4C9" stroke-width="1.5" opacity="0.25"/>

  <!-- River-of-God wave motif -->
  <path d="M -40 560 C 180 500, 320 620, 520 560 C 720 500, 860 620, 1060 560 C 1180 528, 1260 560, 1320 540"
        fill="none" stroke="url(#wave1)" stroke-width="10" stroke-linecap="round"/>
  <path d="M -40 610 C 200 555, 340 670, 560 610 C 780 550, 900 670, 1120 610 C 1220 582, 1280 600, 1320 590"
        fill="none" stroke="url(#wave2)" stroke-width="8" stroke-linecap="round"/>
  <path d="M -40 660 C 220 615, 360 715, 600 660 C 840 605, 960 715, 1160 660 C 1240 638, 1280 650, 1320 645"
        fill="none" stroke="url(#wave1)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <rect width="1280" height="720" fill="black" opacity="0.12"/>
</svg>
